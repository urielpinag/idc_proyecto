# Ingress del frontend de TV Hub (TVH-24).
# ALB gestionado por AWS Load Balancer Controller, en el mismo grupo `tvhub` que
# la API (TVH-23): una sola ALB enruta /api al backend y / al frontend.
# Sin `host`: así responde al DNS que AWS asigna al ALB (el dominio final aún no existe).
#
# PENDIENTE (fuera de TVH-24): TLS/certificado ACM y `listen-ports` 443, además de
#   - alb.ingress.kubernetes.io/certificate-arn: <arn del certificado ACM>
#   - alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
#   - alb.ingress.kubernetes.io/ssl-redirect: '443'
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tvhub-web
  namespace: dev
  labels:
    app.kubernetes.io/name: tvhub-web
    app.kubernetes.io/part-of: tvhub
  annotations:
    alb.ingress.kubernetes.io/group.name: tvhub
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tvhub-web
                port:
                  number: 80
