# PLANTILLA de Secret del backend de TV Hub (TVH-23). NO APLICAR TAL CUAL.
#
# Este archivo es solo documentación de la forma del Secret: los valores son
# placeholders explícitos y claramente inválidos. El Secret real se crea fuera
# del repositorio con:
#
#   kubectl -n dev create secret generic tvhub-secrets \
#     --from-literal=MONGODB_URI='<uri real de DocumentDB>' \
#     --from-literal=JWT_SECRET='<secreto aleatorio>' \
#     --from-literal=JWT_REFRESH_SECRET='<secreto aleatorio distinto>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# o desde CI con las credenciales inyectadas por GitHub Secrets. Nunca
# commitear valores reales.
apiVersion: v1
kind: Secret
metadata:
  name: tvhub-secrets
  namespace: dev
  labels:
    app.kubernetes.io/name: tvhub-api
    app.kubernetes.io/part-of: tvhub
type: Opaque
stringData:
  MONGODB_URI: "REPLACE_ME_uri_de_documentdb"
  JWT_SECRET: "REPLACE_ME_secreto_aleatorio"
  JWT_REFRESH_SECRET: "REPLACE_ME_secreto_aleatorio_distinto"
