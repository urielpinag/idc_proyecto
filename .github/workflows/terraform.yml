name: Terraform

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: tvhub-terraform
  cancel-in-progress: false

defaults:
  run:
    working-directory: infra

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Formato (fmt -check)
        run: terraform fmt -check -recursive
      - name: Inicializar sin backend
        run: terraform init -backend=false -input=false
      - name: Validar configuración
        run: terraform validate

  plan:
    name: plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' && vars.INFRA_PLAN_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Inicializar con backend remoto
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=tvhub/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_TABLE }}" \
            -backend-config="encrypt=true"
        env:
          TF_VAR_master_username: ${{ secrets.DOCDB_MASTER_USERNAME }}
          TF_VAR_master_password: ${{ secrets.DOCDB_MASTER_PASSWORD }}
      - name: Planificar
        run: terraform plan -input=false -no-color -out=tfplan
        env:
          TF_VAR_master_username: ${{ secrets.DOCDB_MASTER_USERNAME }}
          TF_VAR_master_password: ${{ secrets.DOCDB_MASTER_PASSWORD }}
      - name: Publicar plan como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/tfplan
          retention-days: 7
          if-no-files-found: error

  apply:
    name: apply
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.INFRA_APPLY_ENABLED == 'true'
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Inicializar con backend remoto
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=tvhub/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_TABLE }}" \
            -backend-config="encrypt=true"
      - name: Aplicar
        run: terraform apply -input=false -auto-approve -no-color
        env:
          TF_VAR_master_username: ${{ secrets.DOCDB_MASTER_USERNAME }}
          TF_VAR_master_password: ${{ secrets.DOCDB_MASTER_PASSWORD }}
